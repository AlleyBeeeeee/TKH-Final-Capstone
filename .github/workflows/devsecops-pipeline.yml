name: "DevSecOps Infrastructure Pipeline"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  security-and-lint:
    name: "Security Scan & Terraform Linting"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      # Step 2: Set up Terraform CLI
      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Step 3: Verify Canonical Code Formatting
      - name: "Terraform Format Check"
        run: terraform fmt -check

      # Step 4: Validate Terraform Syntax
      - name: "Terraform Init & Validate"
        run: |
          terraform init -backend=false
          terraform validate

      # Step 5: Execute tfsec Static Application Security Testing (SAST)
      - name: "Run tfsec Security Scanner"
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false
